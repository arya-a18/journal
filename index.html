<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0b0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journal">
<title>Midnight Pages</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Caveat:wght@400;600&family=Dancing+Script&family=Homemade+Apple&family=Indie+Flower&family=Kalam&family=Shadows+Into+Light&family=La+Belle+Aurore&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a35f; --gold-hi:#f0d79a; --gold-lo:#8a6326;
  --bone:#efe6d6; --muted:#b9a79f;
  --panel:#1f1215; --panel-2:#2c1a1f; --line-soft:rgba(201,163,95,.28);
  --danger:#e07a8f;
  --ui:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--ui); color:var(--bone); -webkit-tap-highlight-color:transparent;
  background:radial-gradient(120% 85% at 50% 42%, #2b1519 0%, #150a0d 55%, #060203 100%);
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* bars */
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:56px;min-width:0;overflow:hidden}
#topbar{justify-content:center}
#bottombar{justify-content:center;gap:10px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft);
  border-radius:999px;padding:7px 14px;font-size:17px;font-weight:600;letter-spacing:.01em;cursor:pointer;white-space:nowrap;line-height:1.1;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(201,163,95,.10);border-color:rgba(201,163,95,.55)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:linear-gradient(135deg,#f3dc9b,#c19347 55%,#e6c47f);color:#2a0d12;border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.icon{padding:7px 10px}
.btn[hidden]{display:none}
.sync-dot{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-soft);background:transparent;display:grid;place-items:center;cursor:pointer}
.sync-dot i{width:9px;height:9px;border-radius:50%;background:#6b5a55;display:block}
.sync-dot[data-k="on"] i{background:var(--gold-hi);box-shadow:0 0 8px rgba(240,215,154,.8)}
.sync-dot[data-k="off"] i{background:#7c6a64}
.sync-dot[data-k="out"] i{background:transparent;border:1.5px solid var(--gold)}
.sync-dot[data-k="local"] i{background:transparent;border:1.5px dashed #8c7a74}
@media (max-width:440px){ #topbar .btn.page-only svg{display:none} .btn{padding:7px 12px} .bar{gap:6px;padding:8px} }
@media (max-width:380px){ .btn .lbl-long{display:none} .btn{padding:6px 10px;font-size:16px} .bar{gap:5px;padding:6px} .sync-dot{width:30px;height:30px} }

/* stage + book */
#stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:pan-y}
#book{position:relative;perspective:2400px}
.stack{position:absolute;inset:0;border-radius:3px 9px 9px 3px;background:#e9e0d0;transform:translate(5px,4px);
  box-shadow:1px 1px 0 #d8cdb9,2px 2px 0 #e6dccb,3px 3px 0 #d3c7b2,4px 4px 0 #e2d8c6,6px 6px 0 #bfb29b,0 26px 50px rgba(0,0,0,.65)}
.leaf{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center}
.face{position:absolute;inset:0;overflow:hidden;border-radius:2px 8px 8px 2px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face.back::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(0,0,0,.22),transparent 18%)}
.cover-inside{background:radial-gradient(circle at 30% 30%,#5a1622,#2a070d 70%)}
.sheet{position:absolute;left:0;top:0;width:400px;height:640px;transform:scale(var(--s,1));transform-origin:0 0}
.shade{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}

/* cover */
.cover{position:absolute;inset:0;color:var(--gold)}
.cover-art{position:absolute;inset:0;width:100%;height:100%}
.c-title{position:absolute;left:42px;right:20px;top:84px;text-align:center;font-family:'Pirata One','UnifrakturCook',Georgia,serif;
  line-height:1;letter-spacing:.015em;background:linear-gradient(170deg,#f8e6ae 10%,#c39143 45%,#efd18a 62%,#9a6d2a 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.55))}
.c-names{position:absolute;left:42px;right:20px;top:490px;text-align:center;font-family:var(--ui);font-style:italic;font-weight:600;font-size:29px;
  color:#e7c983;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.c-tag{position:absolute;left:62px;right:40px;top:536px;text-align:center;font-family:var(--ui);font-style:italic;font-size:15.5px;color:#d9c0b4;opacity:.78}

/* page */
.paper{position:absolute;inset:0;background:var(--page);color:var(--ink)}
.paper::before{content:"";position:absolute;inset:0 auto 0 0;width:34px;pointer-events:none;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.20),rgba(0,0,0,0))}
.page-head{position:absolute;left:34px;right:22px;top:16px;height:44px;display:flex;align-items:flex-end;gap:10px;font-family:var(--font)}
.date-wrap{position:relative;display:inline-block}
.date-show{font-size:calc(var(--fs) * .95);line-height:1.15;border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent);padding:0 2px 2px;white-space:nowrap}
.date-in{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.d-week{font-size:calc(var(--fs) * .78);opacity:.62;padding-bottom:3px;white-space:nowrap}
.write-area{position:absolute;left:0;right:0;top:62px;bottom:30px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink) 30%,transparent) transparent}
.write-content{position:relative;min-height:100%;padding:0 22px 0 36px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 28.7px,color-mix(in srgb,var(--line) 70%,transparent) 28.7px,color-mix(in srgb,var(--line) 70%,transparent) 30px);
  background-position:0 -6px}
body.kb .write-content{padding-bottom:330px}
.editor{min-height:540px;outline:none;font-family:var(--font);font-size:var(--fs);line-height:30px;color:var(--ink);caret-color:var(--ink);
  white-space:pre-wrap;overflow-wrap:anywhere;padding-top:1px}
.editor:empty::before{content:attr(data-placeholder);opacity:.33;pointer-events:none}
.stk-layer{position:absolute;inset:0;pointer-events:none}
.folio{position:absolute;left:0;right:0;bottom:7px;text-align:center;font:italic 600 13px var(--ui);color:var(--ink);opacity:.45}

/* stickers */
.sticker{position:absolute;left:0;top:0;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;line-height:1}
.sticker.sel{outline:1.5px dashed rgba(201,163,95,.95);outline-offset:5px;border-radius:6px}
.sticker .emo{display:block;font-size:44px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.sticker svg{display:block}
.tape{display:block;width:124px;height:30px;background:var(--tc);opacity:.78;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 6px,transparent 6px 14px);
  clip-path:polygon(0 4%,3% 0,6% 6%,94% 0,97% 5%,100% 0,100% 100%,97% 95%,94% 100%,6% 96%,3% 100%,0 96%)}
.stk-tools{position:absolute;transform:translateX(-50%);display:flex;gap:2px;padding:3px;border-radius:999px;background:#241417;border:1px solid var(--line-soft);
  pointer-events:auto;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.stk-tools button{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--bone);font-size:17px;cursor:pointer}
.stk-tools button:hover{background:rgba(201,163,95,.18)}
.stk-tools button[data-a="del"]{color:var(--danger)}

/* drawers */
#backdrop{position:fixed;inset:0;background:rgba(6,2,3,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#backdrop.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;left:50%;bottom:var(--kbo,0px);transform:translate(-50%,110%);width:min(560px,100%);max-height:min(78dvh,680px);overflow:auto;
  background:linear-gradient(180deg,var(--panel-2),var(--panel) 120px);border:1px solid var(--line-soft);border-bottom:0;border-radius:20px 20px 0 0;
  padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:21;visibility:hidden}
#drawer.open{transform:translate(-50%,0);visibility:visible}
.grip{width:42px;height:4px;border-radius:4px;background:rgba(239,230,214,.25);margin:4px auto 10px}
.d-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.d-head h2{margin:0;font-size:25px;font-weight:700;letter-spacing:.005em;color:var(--gold-hi)}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-soft);background:transparent;cursor:pointer;font-size:16px}
.hint{margin:0 0 12px;color:var(--muted);font-size:17px;line-height:1.35}
.sec{margin:14px 0 6px;font-size:18px;font-weight:700;color:var(--bone)}
.field{display:flex;flex-direction:column;gap:5px;font-size:16px;color:var(--muted);flex:1;min-width:0}
.field input,.field select,.inp{background:#140b0d;border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;font-size:18px;color:var(--bone);width:100%}
.field input:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
#fd{display:grid;grid-template-columns:minmax(88px,1fr) minmax(120px,1.5fr) minmax(80px,1fr);gap:10px}
#fd button[type=submit]{grid-column:1 / -1;justify-content:center}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.msg{margin-top:12px;font-size:17px;line-height:1.4;color:var(--bone)}
.msg.err{color:var(--danger)}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:var(--c);cursor:pointer;position:relative;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--gold-hi)}
.sw.custom{background:conic-gradient(#e0565b,#e8c45a,#6fbf73,#4f8fd6,#9b6ad6,#e0565b);overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.font-opt{background:#f7f1e6;color:#1b1b1b;border:2px solid transparent;border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;min-height:58px}
.font-opt.on{border-color:var(--gold)}
.font-opt b{display:block;font:600 13px var(--ui);color:#6d5a52;margin-bottom:2px}
input[type=range]{width:100%;accent-color:var(--gold)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line-soft);background:transparent;border-radius:999px;padding:5px 13px;font-size:16px;font-weight:600;cursor:pointer}
.tab.on{background:rgba(201,163,95,.18);border-color:var(--gold)}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.tray button{height:58px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.04);cursor:pointer;display:grid;place-items:center;font-size:32px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tray button:hover{background:rgba(201,163,95,.14)}
.tray .tape{width:46px;height:16px}
.dict-out{margin-top:12px}
.dict-word{font-size:30px;font-weight:700;color:var(--gold-hi);margin:0}
.dict-ph{color:var(--muted);font-size:18px;display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.dict-pos{font-style:italic;font-weight:700;font-size:19px;margin:14px 0 4px;color:var(--bone)}
.dict-out ol{margin:0;padding-left:22px}
.dict-out li{margin:5px 0;font-size:18px;line-height:1.4}
.dict-ex{display:block;color:var(--muted);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line-soft);background:transparent;border-radius:999px;padding:3px 11px;font-size:16px;cursor:pointer}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-list button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);cursor:pointer;font-size:19px;font-weight:600}
.menu-list button small{font-weight:500;font-size:15px;color:var(--muted)}
.menu-list button.danger{color:var(--danger)}
.link{background:none;border:0;color:var(--gold-hi);text-decoration:underline;cursor:pointer;padding:0;font-size:17px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#2a171b;border:1px solid var(--line-soft);
  color:var(--bone);padding:10px 16px;border-radius:12px;font-size:17px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:min(92vw,460px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
body.kb #bottombar{display:none}
@media (prefers-reduced-motion:reduce){#drawer,#toast,#backdrop{transition:none}}
</style>
</head>

<div id="app">
  <header id="topbar" class="bar">
    <button class="btn page-only" id="b-dict" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg><span>Dictionary</span></button>
    <button class="btn page-only" id="b-style" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 4l6 6-9 9H5v-6z"/><path d="M12 6l6 6"/></svg><span>Style</span></button>
    <button class="btn page-only" id="b-stk" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span>Stickers</span></button>
    <span class="spacer cover-only"></span>
    <button class="sync-dot" id="b-sync" type="button" aria-label="Sync status"><i></i></button>
    <button class="btn icon" id="b-menu" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
  </header>
  <main id="stage"><div id="book"><div class="stack"></div></div></main>
  <footer id="bottombar" class="bar">
    <button class="btn page-only" id="b-prev" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl-long">Back</span></button>
    <button class="btn" id="b-find" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Find a date</span></button>
    <button class="btn primary" id="b-next" type="button"><span id="next-lbl">New page</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>
  </footer>
</div>
<div id="backdrop"></div>
<section id="drawer" role="dialog" aria-modal="true" aria-label="Panel"></section>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">

const PAGE_COLORS = ['#ffffff','#fbf6ec','#f2e6cf','#f7e3e6','#e7edf3','#e8efe2','#2b2326','#151216'];

/* ---------- state ---------- */
const LS = { pages:'mp.pages.v1', settings:'mp.settings.v1', dict:'mp.dict.v1' };

/* ---------- leaves ---------- */
function buildLeaf(idx) {
  const leaf = document.createElement('div'); leaf.className = 'leaf';
  const front = document.createElement('div'); front.className = 'face front';
  const back = document.createElement('div'); back.className = 'face back';
  const sheet = document.createElement('div'); sheet.className = 'sheet';
  const shade = document.createElement('div'); shade.className = 'shade';
  front.append(sheet, shade); leaf.append(front, back);
  if (idx < 0) { leaf.classList.add('is-cover'); sheet.innerHTML = coverHTML(); back.classList.add('cover-inside'); }
  else { const p = order[idx]; leaf.dataset.id = p.id; back.style.background = p.style.pageColor; fillPage(sheet, p, idx); }
  return leaf;
}
function applyPaperVars(paper, st) {
  paper.style.setProperty('--page', st.pageColor);
  paper.style.setProperty('--line', st.lineColor);
  paper.style.setProperty('--ink', st.ink);
  paper.style.setProperty('--font', fontById(st.font).css);
  paper.style.setProperty('--fs', st.size + 'px');
}
function fillPage(sheet, p, idx) {
  sheet.innerHTML = `<div class="paper">
    <div class="page-head">
      <span class="date-wrap"><span class="date-show"></span><input class="date-in" type="date" aria-label="Date of this page"></span>
      <span class="d-week"></span>

    </div></div>
    <div class="folio">${idx + 1}</div>
  </div>`;
  const paper = $('.paper', sheet); applyPaperVars(paper, p.style);
  const dIn = $('.date-in', sheet);
  const showDate = () => { $('.date-show', sheet).textContent = longDate(p.date); $('.d-week', sheet).textContent = weekday(p.date); dIn.value = p.date; };
  showDate();
  dIn.addEventListener('click', () => { try { dIn.showPicker(); } catch {} });
  dIn.addEventListener('change', () => {
    if (!dIn.value) { dIn.value = p.date; return; }
    p.date = dIn.value; touchPage(p); showDate(); refreshOrder(); updateFolio();
    toast('Page dated ' + longDate(p.date));
  });

  ed.contentEditable = PLAINTEXT_OK ? 'plaintext-only' : 'true';

  if (!PLAINTEXT_OK) ed.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain')); });

}
function updateFolio() { const f = $('.leaf.active .folio'); if (f && cur >= 0) f.textContent = cur + 1; updateBars(); }
function mountStatic(idx) {
  $$('.leaf', book).forEach(l => l.remove());
  const l = buildLeaf(idx); l.classList.add('active'); book.append(l);
  cur = idx; curId = idx >= 0 ? order[idx].id : null; updateBars();
}

let flipping = false;
async function flipTo(idx) {
  if (flipping || idx === cur || idx < -1 || idx >= order.length) return;
  flipping = true; deselectSticker(); document.activeElement?.blur?.(); saveLocalNow();
  const old = $('.leaf.active', book), nl = buildLeaf(idx), fwd = idx > cur;
  const dur = reduceMotion ? 1 : 720, ease = 'cubic-bezier(.45,.05,.3,1)';
  if (fwd) {
    nl.style.zIndex = 1; old.style.zIndex = 2; book.insertBefore(nl, old);
    $('.shade', old).animate([{ opacity:0 }, { opacity:.6 }], { duration:dur, fill:'forwards' });
    await old.animate([{ transform:'rotateY(0deg)' }, { transform:'rotateY(-180deg)' }], { duration:dur, easing:ease, fill:'forwards' }).finished;
  } else {
    nl.style.zIndex = 2; old.style.zIndex = 1; book.append(nl);
    $('.shade', nl).animate([{ opacity:.6 }, { opacity:0 }], { duration:dur, fill:'forwards' });
    const a = nl.animate([{ transform:'rotateY(-180deg)' }, { transform:'rotateY(0deg)' }], { duration:dur, easing:ease, fill:'forwards' });
    await a.finished; a.cancel(); $('.shade', nl).getAnimations().forEach(x => x.cancel());
  }
  old.remove(); nl.style.zIndex = ''; nl.classList.add('active');
  cur = idx; curId = idx >= 0 ? order[idx].id : null; updateBars(); flipping = false;
}

/* ---------- navigation ---------- */
function goNext() {
  if (cur === -1) return openNewPage();
  if (cur < order.length - 1) return flipTo(cur + 1);
  if (isBlank(order[cur])) return toast('This page is still blank. Write something first.');
  const p = createPage(todayISO()); flipTo(order.indexOf(p));
}
function goPrev() { if (cur >= 0) flipTo(cur - 1); }
function openNewPage() {
  const last = order[order.length - 1];
  if (last && isBlank(last)) { if (last.date !== todayISO()) { last.date = todayISO(); touchPage(last); refreshOrder(); } return flipTo(order.indexOf(last)); }
  const p = createPage(todayISO()); flipTo(order.indexOf(p));
}
function openLatest() { if (!order.length) return openNewPage(); flipTo(order.length - 1); }
function updateBars() {
  const onCover = cur < 0;
  $$('.page-only').forEach(b => b.hidden = onCover);
  $$('.cover-only').forEach(b => b.hidden = !onCover);
  $('#next-lbl').textContent = onCover ? 'New page' : (cur >= order.length - 1 ? 'New page' : 'Next');
  updateSyncUI();
}
$('#b-next').addEventListener('click', goNext);
$('#b-prev').addEventListener('click', goPrev);

/* swipe */
let sw = null;
stage.addEventListener('pointerdown', e => {
  if (flipping || e.target.closest('.sticker,.stk-tools,input,button,select')) { sw = null; return; }
  if (e.pointerType === 'mouse' && e.target.closest('.editor')) { sw = null; return; }
  sw = { x:e.clientX, y:e.clientY, t:Date.now() };
}, { passive:true });
stage.addEventListener('pointerup', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y, dt = Date.now() - sw.t; sw = null;
  const sel = getSelection();
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6 || dt > 800 || (sel && !sel.isCollapsed)) return;
  if (dx < 0) { cur === -1 ? openLatest() : goNext(); } else goPrev();
});
stage.addEventListener('pointercancel', () => { sw = null; });
addEventListener('keydown', e => {
  if (e.key === 'Escape' && drawerName) return closeDrawer();
  const t = e.target;
  if (t.closest?.('.editor,input,select,textarea') || drawerName) return;
  if (e.key === 'ArrowRight') { cur === -1 ? openLatest() : goNext(); }
  if (e.key === 'ArrowLeft') goPrev();
});

/* ---------- stickers ---------- */
let selected = null;
function placeSticker(el, s) { el.style.left = s.x + 'px'; el.style.top = s.y + 'px'; el.style.transform = `translate(-50%,-50%) rotate(${s.r}deg) scale(${s.s})`; }

/* ---------- sync (Firebase) ---------- */
let fb = { ready:false, user:null, unsubs:[] };
function syncState() {
  if (!FIREBASE_CONFIG) return { k:'local', t:'Saved on this device only. Sync is not set up yet.' };
  if (!fb.ready) return { k:'off', t:navigator.onLine ? 'Connecting…' : 'Offline. Everything is saved on this device.' };
  if (!fb.user) return { k:'out', t:'Not signed in. Pages are saved on this device only.' };
  if (!navigator.onLine) return { k:'off', t:'Offline. Changes will sync when you reconnect.' };
  return { k:'on', t:'Synced as ' + fb.user.email };
}
function updateSyncUI() { const s = syncState(), b = $('#b-sync'); b.dataset.k = s.k; b.title = s.t; b.setAttribute('aria-label', s.t); }
addEventListener('online', updateSyncUI); addEventListener('offline', updateSyncUI);
$('#b-sync').addEventListener('click', openAccount);

async function initSync() {
  updateSyncUI();
  if (!FIREBASE_CONFIG) return;
  try {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
    const [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const app = A.initializeApp(FIREBASE_CONFIG);
    const auth = Au.getAuth(app);
    let db;
    try { db = F.initializeFirestore(app, { localCache:F.persistentLocalCache({ tabManager:F.persistentMultipleTabManager() }) }); }
    catch { db = F.getFirestore(app); }
    fb = { ready:true, Au, F, auth, db, user:null, unsubs:[] };
    Au.onAuthStateChanged(auth, u => {
      fb.user = u; fb.unsubs.forEach(x => x()); fb.unsubs = [];
      if (u) startListeners();
      updateSyncUI(); if (drawerName === 'account') openAccount();
    });
  } catch (err) { console.warn('Sync unavailable', err); updateSyncUI(); }
}
const clean = o => JSON.parse(JSON.stringify(o));
function pushPage(p) {
  if (!fb.user) return;
  const { F, db } = fb;
  F.setDoc(F.doc(db, 'users', fb.user.uid, 'pages', p.id), clean(p)).catch(e => console.warn(e));
}
function pushSettings() {
  settingsTimer = null; if (!fb.user) return;
  const { F, db } = fb;
  F.setDoc(F.doc(db, 'users', fb.user.uid, 'meta', 'settings'), clean(state.settings)).catch(e => console.warn(e));
}
function startListeners() {
  const { F, db } = fb, uid = fb.user.uid;
  let first = true;
  fb.unsubs.push(F.onSnapshot(F.collection(db, 'users', uid, 'pages'), snap => {
    let changed = false; const remote = new Map();
    snap.forEach(d => remote.set(d.id, d.data()));
    for (const [id, r] of remote) {
      const l = state.pages[id];
      if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) { state.pages[id] = normalizePage({ ...r, id }); changed = true; }
    }
    if (first) {
      first = false;
      for (const p of Object.values(state.pages)) { const r = remote.get(p.id); if (!r || (r.updatedAt || 0) < p.updatedAt) pushPage(p); }
    }
    if (changed) { saveLocalNow(); onRemoteChange(); }
    updateSyncUI();
  }, err => { console.warn(err); toast('Sync stopped: ' + (err.code || 'unknown error')); }));
  let firstS = true;
  fb.unsubs.push(F.onSnapshot(F.doc(db, 'users', uid, 'meta', 'settings'), d => {
    const r = d.data();
    if (r && (r.updatedAt || 0) > (state.settings.updatedAt || 0)) {
      state.settings = { ...DEFAULT_SETTINGS, ...r, style:{ ...DEFAULT_STYLE, ...(r.style || {}) } }; saveLocalNow();
      const cov = $('.leaf.active.is-cover .sheet'); if (cov) cov.innerHTML = coverHTML();

}
function onRemoteChange() {

  if (keepId && cur < 0) { mountStatic(order.length ? order.length - 1 : -1); return; }
  const ed = $('.leaf.active .editor');
  const editing = ed && document.activeElement === ed;
  if (cur >= 0 && !editing && !selected) mountStatic(cur); else updateFolio();
}

function openAccount() {

    openDrawer('account', 'Account and sync', `<p class="hint">Right now your journal lives on this device only, and it works fully offline.</p>
      <p class="hint">To keep your phone and laptop in step with one email account, add your free Firebase keys to <b>index.html</b>. The README file walks through it step by step, in about 15 minutes.</p>
      <p class="hint">Until then, you can move pages between devices with Download a backup and Restore from a backup in the menu.</p>`);
    return;
  }
  if (!fb.ready) { openDrawer('account', 'Account and sync', `<p class="hint">${navigator.onLine ? 'Connecting to sync…' : 'You are offline. Connect to the internet once to sign in. After that, writing works offline and syncs when you are back online.'}</p>`); return; }
  if (fb.user) {
    const d = openDrawer('account', 'Account and sync', `<p class="hint">Signed in as <b style="color:var(--bone)">${esc(fb.user.email)}</b>.</p>
      <p class="hint">${esc(syncState().t)}. Sign in with the same email on your phone and laptop to see the same journal on both.</p>
      <div class="actions"><button class="btn" type="button" id="ac-out">Sign out</button></div>`);
    $('#ac-out', d).addEventListener('click', async () => { flushAll(); await fb.Au.signOut(fb.auth); toast('Signed out. Your pages stay on this device.'); });
    return;
  }
  const d = openDrawer('account', 'Account and sync', `<p class="hint">Sign in with your email to keep this journal the same on your phone and laptop.</p>
    <form id="ac" autocomplete="on">
      <div class="row"><label class="field">Email<input name="email" type="email" autocomplete="email" required></label></div>
      <div class="row" style="margin-top:10px"><label class="field">Password<input name="pw" type="password" autocomplete="current-password" minlength="6" required></label></div>
      <div class="actions"><button class="btn primary" type="submit">Sign in</button><button class="btn" type="button" id="ac-new">Create account</button></div>
      <p style="margin-top:12px"><button class="link" type="button" id="ac-reset">Forgot password?</button></p>
      <p class="msg" id="ac-msg"></p>
    </form>`);
  const f = $('#ac', d), msg = $('#ac-msg', d);
  const errText = e => ({
    'auth/invalid-credential':"That email and password don't match.", 'auth/wrong-password':"That email and password don't match.",
    'auth/user-not-found':'No account with that email yet. Tap Create account.', 'auth/email-already-in-use':'That email already has an account. Tap Sign in.',
    'auth/weak-password':'Use a password with at least 6 characters.', 'auth/invalid-email':'Check the email address.',
    'auth/network-request-failed':'No internet. Connect once to sign in.', 'auth/too-many-requests':'Too many tries. Wait a minute and try again.',
  }[e.code] || ('Sign-in failed: ' + (e.code || e.message)));
  const run = async fn => { msg.className = 'msg'; msg.textContent = 'One moment…'; try { await fn(); } catch (e) { msg.className = 'msg err'; msg.textContent = errText(e); } };
  f.addEventListener('submit', e => { e.preventDefault(); run(() => fb.Au.signInWithEmailAndPassword(fb.auth, f.email.value.trim(), f.pw.value)); });
  $('#ac-new', d).addEventListener('click', () => { if (!f.reportValidity()) return; run(() => fb.Au.createUserWithEmailAndPassword(fb.auth, f.email.value.trim(), f.pw.value)); });
  $('#ac-reset', d).addEventListener('click', () => {
    if (!f.email.value.trim()) { msg.className = 'msg err'; msg.textContent = 'Type your email first.'; return; }
    run(async () => { await fb.Au.sendPasswordResetEmail(fb.auth, f.email.value.trim()); msg.className = 'msg'; msg.textContent = 'Reset link sent. Check your inbox.'; });
  });
}

/* ---------- start ---------- */
refreshOrder();
layout(true);
mountStatic(-1);
initSync();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
document.fonts?.ready?.then(() => { if (cur < 0) mountStatic(-1); });
</script>
</body>
</html>
